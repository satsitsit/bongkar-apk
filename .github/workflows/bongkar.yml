name: Bongkar APK JADX

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Repo
      uses: actions/checkout@v4

    - name: 2. Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 3. Download JADX
      run: |
        wget https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
        unzip jadx-1.5.0.zip -d jadx

    - name: 4. Download APK dari Release
      run: |
        # Link sudah diperbaiki sesuai screenshot kamu
        wget "https://github.com/satsitsit/bongkar-apk/releases/download/v1/DeepCine.PREMIUM_V4.0.7.SFILE.MOBI.apk" -O app.apk

    - name: 5. Proses Decompile APK
      run: |
        java -Xmx4g -cp jadx/lib/jadx-1.5.0-all.jar jadx.cli.JadxCLI -d hasil_bongkar app.apk

    - name: 6. Cari URL API
      run: |
        echo "=== MENCARI URL VELVETREEL ==="
        grep -rn "velvetreel.7nkznc.com" hasil_bongkar/ > hasil_url.txt || true
        
        echo "=== MENCARI ENDPOINT PENTING ==="
        grep -rniE "api/|/v1/|/v2/|search|movie|series" hasil_bongkar/ | grep -i "http" >> hasil_url.txt || true
        
        echo "--- HASIL AKHIR ---"
        cat hasil_url.txt

    - name: 7. Simpan Hasil
      uses: actions/upload-artifact@v4
      with:
        name: Hasil-URL-API
        path: hasil_url.txt
